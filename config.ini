; FFR:AutoBattle. The party plays from the gear, skills and Vision you equipped.
; Edit this file, then restart the game.
; Each setting below is at its default. A missing line uses that same default.
; F10 and F9 are remembered in state.txt. That file then wins over Enabled and Echo.
; The section headers are only for reading. A setting works in either section.

; ============================================================================
[AutoBattle Core Features]
; How auto battle plays and the keys that control it.
; ============================================================================

; Default: true.
; true: the party chooses each command. false: you play, and the mod only watches.
; After F10, state.txt remembers the choice and this line is not used.
Enabled = true

; Default: false.
; false: start in No Mercy, the full plan.
; true: start in Echo. Each character repeats the last turn you gave them by
; hand, exactly, Dualcast included. Only a target that fell or can't take it
; changes. A character with no turn on record, or a turn that can't go out
; now, is handed to you.
; Turns are recorded only while Echo is the mode, with auto battle on or off.
; Never echoed, by design: items, raises, Limit Bursts, Esper calls, a summon's
; own turns, and the Resonance wheel. They are left to you, and the last
; recorded turn stays. The README's Echo section lists them.
; A turn with a skill the character no longer has (a Vision or ability change) is handed to you.
; ItemPrice, EsperLevelGap and ResonanceLevelGap do not apply in Echo.
; The README's Echo section has the details.
; After F9, state.txt remembers the choice and this line is not used.
Echo = false

; Default: true.
; true: Echo's record of your turns is kept in echo.txt in this folder, so it
; is still there the next time you play. Delete echo.txt to clear it.
; false: the record lasts until you quit the game, and echo.txt is not read or written.
; A change needs a restart.
EchoKeep = true

; Default: true.
; false: choose and log the command, but leave the menu for you. Use this if a
; choice ever does something unexpected; the log still shows what it would have done.
Submit = true

; Default: F10.
; F10 turns auto battle on or off and flashes that on the screen.
; Off still records your commands, falls, breaks, and gauges. On again
; mid-fight plans from that record and takes an open command menu.
; In a fight the right trigger fires this same action. It does not press F10.
; Outside a fight the trigger stays with the game.
TakeOverKey = F10

; Default: F9.
; F9 switches the mode between No Mercy and Echo.
; It flashes AutoBattle: No Mercy! or AutoBattle: Echo!
; The choice is remembered in state.txt. There is no settings box.
; In a fight, while auto battle is on, the left trigger fires this same action.
; It does not press F9. The game still receives that press.
; While auto battle is off, or outside a fight, the trigger stays with the game,
; except on the field with LargeMap = true, where it is MapKey.
MenuKey = F9

; Default: 5000. No Mercy only.
; The party leaves an item in the bag when its buy price is above this.
; Raise the number to spend the more expensive items.
; A change needs a restart.
ItemPrice = 5000

; Default: 3. No Mercy only.
; A fight that only looks dangerous gets no Esper when every foe is at least
; this many levels under the character who would call it.
; A boss, or a hit this fight has shown would kill an ally, still gets the call.
; 0: off. Danger moves get a call at any level.
; -1: no Esper is ever called. You can still call one by hand.
; A change needs a restart.
EsperLevelGap = 3

; Default: 3. No Mercy only.
; The same as EsperLevelGap, for the Resonance wheel. The wheel is skipped when
; every foe is at least this many levels under every standing ally.
; A boss, or an ally who is down or about to die, still gets the pick.
; 0: off. The mod picks on every wheel.
; -1: every wheel is left to you. The mod never picks or skips.
; A change needs a restart.
ResonanceLevelGap = 3

; ============================================================================
[Optional Settings]
; Extras. Each one is off unless you turn it on.
; ============================================================================

; Default: false.
; false: the mod writes no report, and only its startup line and real errors go to
; UE4SS.log. true: each fight is written to battle_report.txt in this folder when it
; ends. It is useful for reporting a problem and keeps the last five fights. Delete it
; any time.
Reporting = false

; Default: false.
; true: a Limit Burst, a Vision finish, an Esper summon, or that Esper's own attack ends through the game's own skip.
; Other attacks and story events stay.
; A change needs a restart.
SkipScenes = false

; Default: false.
; true: MapKey, the left trigger, and the middle mouse button show the field minimap large in the middle
; of the screen. false: neither one does anything, and the minimap stays as the
; game draws it.
; A change needs a restart.
LargeMap = false

; Default: F8. Used only when LargeMap = true.
; On the field, F8 moves the minimap to the middle of the screen and draws it
; large. Press it again to put it back in its corner.
; It does not turn on in a fight. A press in a fight still turns it off.
; On the field the left trigger (LT or L2) fires this same action. It does not press F8.
; In a menu the trigger stays with the game. In a fight it is the MenuKey trigger.
; On the field the middle mouse button fires it too. In a menu and on the world
; map that button stays with the game.
MapKey = F8

; Default: 80. Used only when LargeMap = true.
; How large the big map is, as a percent of the screen height (20 to 100).
; A change needs a restart.
MapSize = 80

; Experimental. It may not behave right in every fight. Leave it off if anything looks wrong.
; Default: false.
; true: during a fight, actions play at four times the battle speed button's fastest mark.
; It starts with the first command, so the opening of a fight plays at normal speed.
; The command menu stays at the game's command-select speed, so the plan still has its wait.
; A Limit Burst, a Vision finish, and an Esper scene stay at normal speed.
; The speed stops when the battle result begins. The story after the fight stays at normal speed.
; A change needs a restart.
Turbo = false

; Dev use only. This is for testing and is not meant for normal play.
; Default: false.
; true: after a fight, a character whose level is above every monster in it gains no experience.
; A monster at or above that character still pays the game's own amount, including when another character is above them.
; A change needs a restart.
LevelGate = false

; FFR Loadout. The party plays from the gear, skills and Vision you equipped.
; Edit this file, then restart the game. F10 toggles auto battle while you play,
; and that is remembered in state.txt.

; true: the party chooses each command. false: you play, and the mod only watches.
Enabled = true

; Multiplies the game's own 1 / 1.5 / 2 battle-speed steps. 1 leaves them alone.
; Set this to 1 if another mod already changes battle speed.
BattleSpeed = 2

; false: choose and log the command, but leave the menu for you. Use this if a
; choice ever does something unexpected; the log still shows what it would have done.
Submit = true

TakeOverKey = F10

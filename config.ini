; FFR:AutoBattle settings
; Edit this file, then restart the game.
; Every line below is at its default. A missing line uses its default.
; Section headers are only for reading.

; ============================================================================
[Auto Battle]
; ============================================================================

; Start with auto battle on.
; F10 changes it in game, and state.txt then remembers that choice instead.
; Values: true or false
; Default: true
Enabled = true

; Start in Echo mode instead of No Mercy.
; No Mercy: the party plays the full plan.
; Echo: each character repeats the last turn you gave them by hand.
; F9 changes it in game, and state.txt then remembers that choice instead.
; Values: true or false
; Default: false
Echo = false

; Turns auto battle on or off. In a fight, the right trigger does the same.
; Values: a key name, such as F7 or F11. Use capital letters, as written here.
; Default: F10
TakeOverKey = F10

; Switches between No Mercy and Echo. In a fight, with auto battle on,
; the left trigger does the same.
; Values: a key name, such as F7 or F11. Use capital letters, as written here.
; Default: F9
MenuKey = F9

; ============================================================================
[Speed and Scenes]
; ============================================================================

; Skip Limit Burst, Vision finish, and Esper scenes. Other scenes still play.
; Values: true or false
; Default: false
SkipScenes = false

; Experimental. Fight actions play at 4x the fastest battle speed.
; Menus, Limit Bursts, and Esper scenes stay at normal speed.
; Only runs while auto battle is on. Turn it off if anything looks wrong.
; Values: true or false
; Default: false
Turbo = false

; ============================================================================
[Field Map]
; ============================================================================

; Lets MapKey, the left trigger, and the middle mouse button show the field
; minimap large in the middle of the screen. Not used in fights.
; Values: true or false
; Default: true
LargeMap = true

; Shows or hides the large map. Used only with LargeMap = true.
; Values: a key name, such as F7 or F11. Use capital letters, as written here.
; Default: F8
MapKey = F8

; Large map size, as a percent of screen height.
; Values: 20 to 100. Anything else uses 80.
; Default: 80
MapSize = 80

; ============================================================================
[No Mercy Spending]
; These only apply in No Mercy. In Echo, items, Espers, and the wheel are yours.
; ============================================================================

; Items with a buy price above this stay in the bag.
; Values: 0 or higher, in gil. Higher lets the party spend pricier items.
; Default: 5000
ItemPrice = 5000

; Skip calling an Esper when every foe is this many levels below the caller.
; Bosses and hits that would kill an ally still get an Esper.
; Values: -1, 0, or a number of levels (1 or higher).
;   0: always allowed.  -1: never called (you can still call one by hand).
; Default: 3
EsperLevelGap = 3

; Skip the Resonance wheel when every foe is this many levels below every
; standing ally. Bosses, or an ally down or about to die, still get a pick.
; Values: -1, 0, or a number of levels (1 or higher).
;   0: always picked.  -1: every wheel is left to you.
; Default: 0
ResonanceLevelGap = 0

; ============================================================================
[No Mercy Commands]
; Choose what kinds of commands the party may use. No Mercy only.
;   auto: the party uses them as it sees fit.
;   off:  the party never uses them, and picks something else.
;   hand: when the party would use one, that turn is left to you.
; Attack is always allowed. Espers and the Resonance wheel are set above.
; Turning off Heals or Raises can lose fights. That is your call.
; ============================================================================

; Limit Bursts, including ones that heal or raise.
; Values: auto, off, or hand
; Default: auto
Limits = auto

; Which fights the party spends Limit Bursts in. Used only with Limits = auto or hand.
; Values: hard or any
;   hard: bosses, and fights with a danger move or a hit that would kill.
;   any:  every fight, so the bar is spent on common fights too.
; Default: hard
LimitFights = hard

; HP heals and status cures, from skills or items.
; Values: auto, off, or hand
; Default: auto
Heals = auto

; Raises, from skills or items.
; Values: auto, off, or hand
; Default: auto
Raises = auto

; Support on the party: Haste, Protect, Shell, formations, stances.
; Values: auto, off, or hand
; Default: auto
Buffs = auto

; Debuffs and break marks on foes.
; Values: auto, off, or hand
; Default: auto
Debuffs = auto

; Defend, Cover, and Provoke.
; Values: auto, off, or hand
; Default: auto
Guards = auto

; Every item: Potions, Ethers, Phoenix Downs, and throws.
; Values: auto, off, or hand
; Default: auto
Items = auto

; Scan and other moves that reveal a foe's weaknesses.
; Values: auto, off, or hand
; Default: auto
Scan = auto

; Running from a fight where no foe has lost HP in five rounds.
; Values: auto or off
; Default: auto
Escape = auto

; ============================================================================
[Advanced]
; ============================================================================

; Keep Echo's record of your turns in echo.txt, so it lasts between sessions.
; Delete echo.txt to clear it. false: the record lasts until you quit.
; Values: true or false
; Default: true
EchoKeep = true

; false: the mod picks and logs each command, but leaves the menu for you.
; Useful for checking what it would do.
; Values: true or false
; Default: true
Submit = true

; Write each fight to battle_report.txt (the last five are kept).
; Turn this on when reporting a problem.
; Values: true or false
; Default: false
Reporting = false
